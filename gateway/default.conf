server {
    listen 443 ssl;
    server_name mail.mailcow.test;

    ssl_certificate /etc/nginx/tls/local.crt;
    ssl_certificate_key /etc/nginx/tls/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Never preserve a client-supplied X-Forwarded-For value.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port $server_port;

    location = /admin {
        proxy_pass http://broker;
    }

    location ^~ /access/ {
        proxy_pass http://broker;
    }

    location ^~ /mailbox-access/ {
        proxy_pass http://broker;
    }

    location ^~ /access-links/ {
        proxy_pass http://broker;
    }

    # The generic Mailcow login page is intentionally unavailable.
    # Mailbox authentication is accepted only through a valid mailbox link.
    location = / {
        proxy_pass http://broker;
    }

    location / {
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name mail.mailcow.test;
        proxy_pass https://nginx-mailcow:8444;
        # Mailcow knows its canonical host without the local test port.
        # Keep redirects inside the local TLS gateway.
        proxy_redirect https://mail.mailcow.test/ https://mail.mailcow.test:9443/;
        proxy_redirect http://mail.mailcow.test/ https://mail.mailcow.test:9443/;
    }
}

